    - id: saveAndActivateAction
      type: primary_action
      operatesOn:
        - leafItemContext
        - modifierGroups
        - variantSpecializations
        - structuralValidationStatus
      triggersAction: saveModifierConfigurationAndActivate
      description: "Primary semantic action to validate complete structural capacity across all groups (Capacidad >= minSelections) and persist the leaf MenuItem in ACTIVE status."
      trace: "REQ-MENU-MOD-001, INV-MENU-005, REQ-MENU-VER-001"
    - id: cancelConfigurationAction
      type: action
      operatesOn: null
      triggersAction: cancelConfiguration
      description: "Semantic action to discard pending modifier edits and emit returnToItemEditorSignal."
      trace: "docs/ui-spec-arch.md"
  actions:
    - id: selectVariantForSpecialization
      description: "Focus on a specific MenuItemVariant to author or inspect specialized overrides, or clear focus to inspect item-level baseline."
      parameters:
        - name: variantId
          type: "UUID | null"
          description: "Target MenuItemVariant identifier or null."
      preconditions:
        - "The leaf MenuItem must be of type PREPARED or STOCKED."
        - "If non-null, variantId must identify a variant belonging to this leaf MenuItem."
      effect: "Sets variantSpecializations.focusedVariantId and populates optionOverrides with effective parameters and active overrides."
      trace: "REQ-MENU-MOD-003"
    - id: createModifierGroup
      description: "Add a new ModifierGroup to the leaf MenuItem with selection limits constrained to 0 <= minSelections <= maxSelections <= 99."
      parameters:
        - name: name
          type: String
          description: "Commercial name for the modifier group (1..120 Unicode characters after trim)."
        - name: minSelections
          type: Integer
          description: "Minimum selections required (integer in 0..99, default 0)."
        - name: maxSelections
          type: Integer
          description: "Maximum selections permitted (integer in 0..99, default 1)."
      preconditions:
        - "The leaf MenuItem must be of type PREPARED or STOCKED."
        - "name after trim must have 1..120 Unicode characters (INV-MENU-012)."
        - "minSelections and maxSelections must be integers in range [0, 99] (INV-MENU-011)."
        - "0 <= minSelections <= maxSelections <= 99 (INV-MENU-011)."
      effect: "Appends a new ModifierGroup entity to modifierGroups with unique UUID and updates capacity calculations."
      trace: "REQ-MENU-MOD-001, INV-MENU-011, INV-MENU-012"
    - id: setModifierGroupName
      description: "Update the commercial display name of an existing ModifierGroup."
      parameters:
        - name: modifierGroupId
          type: UUID
          description: "Identifier of the target group."
        - name: name
          type: String
          description: "New non-empty commercial name (1..120 Unicode characters after trim)."
      preconditions:
        - "modifierGroupId must exist on this leaf MenuItem."
        - "name after trim must have 1..120 Unicode characters (INV-MENU-012)."
      effect: "Updates modifierGroups.name."
      trace: "REQ-MENU-MOD-001, INV-MENU-012"
    - id: setModifierGroupSelectionLimits
      description: "Update the selection bounds (minSelections and maxSelections) of a ModifierGroup."
      parameters:
        - name: modifierGroupId
          type: UUID
          description: "Identifier of the target group."
        - name: minSelections
          type: Integer
          description: "New minimum selection bound (integer in range 0..99)."
        - name: maxSelections
          type: Integer
          description: "New maximum selection bound (integer in range 0..99)."
      preconditions:
        - "modifierGroupId must exist on this leaf MenuItem."
        - "minSelections and maxSelections must be integers in range [0, 99] (INV-MENU-011)."
        - "0 <= minSelections <= maxSelections <= 99 (INV-MENU-011)."
      effect: "Updates group minSelections and maxSelections, re-evaluating structural capacity across generalConfig and variant specializations."
      trace: "REQ-MENU-MOD-001, INV-MENU-005, INV-MENU-011"
    - id: createModifierOption
      description: "Add a new ModifierOption to a ModifierGroup with initial baseline generalConfig."
      parameters:
        - name: modifierGroupId
          type: UUID
          description: "Identifier of the parent group."
        - name: name
          type: String
          description: "Commercial name of the option (1..120 Unicode characters after trim)."
        - name: priceDelta
          type: Decimal
          description: "Initial generalConfig.priceDelta in exact DECIMAL(12,2) in range -9999999999.99..9999999999.99 in menu ISO 4217 currency (defaults to 0.00)."
        - name: maxQuantity
          type: Integer
          description: "Initial generalConfig.maxQuantity constrained to an integer in range 0..99 (defaults to 1)."
      preconditions:
        - "modifierGroupId must exist on this leaf MenuItem."
        - "name after trim must have 1..120 Unicode characters (INV-MENU-012)."
        - "priceDelta must be exact DECIMAL(12,2) with at most 2 decimal places in range [-9999999999.99, 9999999999.99] in menu ISO 4217 currency (INV-MENU-007, INV-MENU-008, INV-MENU-009)."
        - "maxQuantity must be an integer in range [0, 99] (INV-MENU-011)."
        - "For any variant inheriting generalConfig, effective variant price (unitPrice + priceDelta) must be >= 0.00 (INV-MENU-010)."
      effect: "Appends new ModifierOption with generalConfig (priceDelta, maxQuantity, ingredientEffects: []) to the target group and recalculates group capacity and effective variant prices."
      trace: "REQ-MENU-MOD-002, INV-MENU-005, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-010, INV-MENU-011, INV-MENU-012"
    - id: setModifierOptionName
      description: "Update the commercial name of a ModifierOption."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the option."
        - name: name
          type: String
          description: "New commercial name (1..120 Unicode characters after trim)."
      preconditions:
        - "modifierOptionId must exist."
        - "name after trim must have 1..120 Unicode characters (INV-MENU-012)."
      effect: "Updates option name."
      trace: "REQ-MENU-MOD-002, INV-MENU-012"
    - id: setGeneralPriceDelta
      description: "Update the baseline price delta on an option's generalConfig."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the option."
        - name: priceDelta
          type: Decimal
          description: "Commercial price delta in exact DECIMAL(12,2) within range -9999999999.99..9999999999.99 with at most 2 decimal places and no implicit rounding, qualified by menu ISO 4217 currency."
      preconditions:
        - "modifierOptionId must exist."
        - "priceDelta must be exact DECIMAL(12,2) with at most 2 decimal places in range [-9999999999.99, 9999999999.99] (INV-MENU-008, INV-MENU-009)."
        - "For any variant inheriting generalConfig, effective variant price (unitPrice + priceDelta) must be >= 0.00 (INV-MENU-010)."
      effect: "Updates generalConfig.priceDelta, validates non-negative effective variant prices across non-overridden variants, and refreshes ResolvedVariantModifier."
      trace: "REQ-MENU-MOD-002, REQ-MENU-MOD-008, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-010"
    - id: setGeneralMaxQuantity
      description: "Update the baseline maximum selectable quantity on an option's generalConfig."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the option."
        - name: maxQuantity
          type: Integer
          description: "Maximum quantity limit constrained to an integer in range 0..99."
      preconditions:
        - "modifierOptionId must exist."
        - "maxQuantity must be an integer in range [0, 99] (INV-MENU-011)."
      effect: "Updates generalConfig.maxQuantity, re-evaluating baseline group capacity and refreshing ResolvedVariantModifier."
      trace: "REQ-MENU-MOD-002, REQ-MENU-MOD-008, INV-MENU-005, INV-MENU-011"
    - id: addGeneralIngredientEffect
      description: "Add an ingredient directive (ADD or OMIT) to the option's baseline generalConfig."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the option."
        - name: operation
          type: String
          description: "Directive operation ('ADD' or 'OMIT')."
        - name: inventoryItemId
          type: String
          description: "Opaque inventory item reference identifier."
        - name: quantity
          type: "Decimal | null"
          description: "Positive quantity (> 0) for ADD; null for OMIT."
        - name: unit
          type: "String | null"
          description: "Metric unit string for ADD; null for OMIT."
      preconditions:
        - "operation must be 'ADD' or 'OMIT'."
        - "If ADD, quantity must be strictly greater than 0 and unit must be non-empty."
        - "If OMIT, quantity and unit are null."
      effect: "Appends IngredientEffect to generalConfig.ingredientEffects and updates ResolvedVariantModifier."
      trace: "REQ-MENU-MOD-002, REQ-MENU-MOD-005, REQ-MENU-MOD-006, REQ-MENU-MOD-008"
    - id: removeGeneralIngredientEffect
      description: "Remove an ingredient directive from the option's baseline generalConfig."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the option."
        - name: effectId
          type: UUID
          description: "Identifier of the effect entry to remove."
      effect: "Removes effect entry from generalConfig.ingredientEffects."
      trace: "REQ-MENU-MOD-002"
    - id: clearGeneralIngredientEffects
      description: "Establish the option as an empty-effect culinary instruction by clearing its generalConfig.ingredientEffects list."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the option."
      effect: "Sets generalConfig.ingredientEffects to empty list [], setting isCulinaryInstruction to true."
      trace: "REQ-MENU-MOD-007"
    - id: setIngredientEffectOperation
      description: "Update the directive operation ('ADD' or 'OMIT') of an ingredient effect in baseline generalConfig, atomically supplying quantity and unit when transitioning to ADD or clearing them to null when transitioning to OMIT."
      parameters:
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the target option."
        - name: effectId
          type: UUID
          description: "Identifier of the target effect entry."
        - name: operation
          type: String
          description: "New directive operation: strictly 'ADD' or 'OMIT'."
        - name: quantity
          type: "Decimal | null"
          description: "Positive quantity to add (> 0) required when transitioning to ADD; null when transitioning to OMIT."
        - name: unit
          type: "String | null"
          description: "Metric measurement unit required when transitioning to ADD; null when transitioning to OMIT."
      preconditions:
        - "operation must be 'ADD' or 'OMIT'."
