      description: "Semantic numeric input for specialized price delta on the focused variant (signed exact DECIMAL(12,2) within range -9999999999.99..9999999999.99 with at most 2 decimal places and no implicit rounding, qualified by menu ISO 4217 currency; must not cause effective variant price to become negative under INV-MENU-010)."
      trace: "REQ-MENU-MOD-003, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-010"
    - id: setVariantMaxQuantityInput
      type: input
      operatesOn: variantSpecializations.optionOverrides.overrideConfig.maxQuantity
      triggersAction: setVariantMaxQuantity
