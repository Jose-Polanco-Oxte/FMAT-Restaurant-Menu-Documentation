view:
  id: ModifierConfigurationView
  name: Modifier Configuration View
  purpose: >
    Provide the menu administrator with a centralized semantic interface to configure modifier groups and
    options owned by leaf MenuItems (PREPARED and STOCKED), author baseline general configurations (generalConfig:
    priceDelta in exact DECIMAL(12,2) in range -9999999999.99..9999999999.99 in menu ISO 4217 currency,
    maxQuantity as integer in 0..99, and ADD, OMIT, or empty-effect culinary ingredientEffects), manage
    per-variant specializations (VariantModifierConfig overrides for enabled, priceDelta, maxQuantity, and
    ingredientEffects adhering to the same bounds and ensuring non-negative effective variant prices >= 0.00),
    execute administrative copy operations between variants of the same item with dry-run simulation, explicit
    FAIL/REPLACE collision resolution, and atomic rollback, and validate structural capacity against minSelections
    constraints, while permitting incomplete-INACTIVE saves with structured warnings and strictly excluding modifier
    ownership from COMBO items and avoiding duplicating operational availability as editable commercial configuration.
  actors:
    - ADMINISTRATOR
  requirements:
    - REQ-MENU-MOD-001
    - REQ-MENU-MOD-002
    - REQ-MENU-MOD-003
    - REQ-MENU-MOD-004
    - REQ-MENU-MOD-005
    - REQ-MENU-MOD-006
    - REQ-MENU-MOD-007
    - REQ-MENU-MOD-008
    - REQ-MENU-LIF-002
    - REQ-MENU-LIF-003
    - INV-MENU-005
    - INV-MENU-007
    - INV-MENU-008
    - INV-MENU-009
    - INV-MENU-010
    - INV-MENU-011
    - INV-MENU-012
  inputs:
    - name: menuItemId
      type: UUID
      required: true
      description: "Identifier of the target leaf MenuItem (PREPARED or STOCKED) that owns the modifier groups."
      trace: "REQ-MENU-MOD-001"
    - name: initialVariantId
      type: "UUID | null"
      required: false
      description: "Pre-selected MenuItemVariant identifier when entering the view to directly inspect or author variant-specific overrides."
      trace: "REQ-MENU-MOD-003"
    - name: returnContext
      type: "String | null"
      required: false
      description: "Contextual origin marker (defaults to 'MenuItemEditorView') indicating the view to return to upon save, completion, or cancellation."
      trace: "docs/ui-spec-arch.md"
  outputs:
    - name: savedMenuItemId
      type: UUID
      description: "Unique identifier of the updated leaf MenuItem emitted upon accepted commercial save."
      trace: "REQ-MENU-MOD-001, REQ-MENU-VER-001"
    - name: newRevisionToken
      type: String
      description: "Newly generated immutable commercial revision token formatted as '<number>_<ISO8601>' emitted upon accepted save."
      trace: "REQ-MENU-VER-001"
    - name: returnToItemEditorSignal
      type: Boolean
      description: "Navigation trigger returning the administrator to MenuItemEditorView upon save, completion, or cancellation."
      trace: "docs/ui-spec-arch.md"
    - name: copyReportNotification
      type: "CopyVariantModifierReport | null"
      description: "Structured notification payload emitted upon dry-run simulation or definitive execution of an administrative copy operation."
      trace: "REQ-MENU-MOD-004"
  regions:
    - id: leafItemHeaderRegion
      role: primary
      description: "Semantic region displaying the commercial identity, discriminator ('PREPARED' or 'STOCKED'), administrative status, and commercial revision token of the parent leaf MenuItem, alongside variant presentation context."
      data:
        - leafItemContext
      controls:
        - variantFocusSelector
    - id: modifierGroupsRegion
      role: primary
      description: "Semantic region for managing ModifierGroup entities owned by the leaf MenuItem, including group name (1..120 Unicode characters after trim), display ordering, and minSelections/maxSelections integer bounds (0 <= minSelections <= maxSelections <= 99)."
      data:
        - modifierGroups
      controls:
        - addModifierGroupAction
        - updateGroupNameInput
        - updateMinSelectionsInput
        - updateMaxSelectionsInput
    - id: modifierOptionsGeneralRegion
      role: primary
      description: "Semantic region for defining ModifierOption entities within each group (option name 1..120 Unicode characters after trim) and configuring their general baseline (generalConfig: priceDelta in exact DECIMAL(12,2) within -9999999999.99..9999999999.99 in menu ISO 4217 currency, maxQuantity integer in 0..99, and ADD, OMIT, or empty-effect culinary ingredientEffects)."
      data:
        - modifierGroups.options
      controls:
        - addModifierOptionAction
        - updateOptionNameInput
        - updateGeneralPriceDeltaInput
        - updateGeneralMaxQuantityInput
        - addGeneralIngredientEffectAction
        - removeGeneralIngredientEffectAction
        - setGeneralEffectOperationSelector
        - updateGeneralEffectInventoryItemIdInput
        - updateGeneralEffectQuantityInput
        - updateGeneralEffectUnitInput
        - clearGeneralIngredientEffectsAction
    - id: variantSpecializationRegion
      role: primary
      description: "Semantic region for configuring variant-specific overrides (VariantModifierConfig) on a selected MenuItemVariant and option, defining specialized enablement, priceDelta (exact DECIMAL(12,2) within -9999999999.99..9999999999.99 in menu ISO 4217 currency, enforcing effective variant price >= 0.00), maxQuantity (integer in 0..99), and ingredientEffects."
      data:
        - variantSpecializations
        - resolvedVariantModifiersProjection
      controls:
        - selectOptionForOverrideAction
        - toggleVariantOptionEnabledToggle
        - setVariantPriceDeltaInput
        - setVariantMaxQuantityInput
        - addVariantIngredientEffectAction
        - removeVariantIngredientEffectAction
        - setVariantEffectOperationSelector
        - updateVariantEffectInventoryItemIdInput
        - updateVariantEffectQuantityInput
        - updateVariantEffectUnitInput
        - clearVariantIngredientEffectsAction
    - id: administrativeCopyRegion
      role: secondary
      description: "Semantic region for executing the administrative copy of VariantModifierConfig overrides from one source variant to one or more target variants of the same leaf MenuItem, supporting dry-run simulation, FAIL/REPLACE collision policies, and collision inspection."
      data:
        - administrativeCopyBuffer
      controls:
        - copySourceVariantSelector
        - copyTargetVariantsMultiSelector
        - copyPolicySelector
        - dryRunCopyAction
        - executeCopyAction
        - clearCopyBufferAction
    - id: validationAndWarningsRegion
      role: supporting
      description: "Semantic region displaying real-time structural capacity evaluation (sum(maxQuantity) >= minSelections across enabled options), non-negative effective price validation (effective variant price >= 0.00 in menu ISO 4217 currency under INV-MENU-010), bounds validation (1..120 chars for names after trim, integers 0..99 for minSelections, maxSelections, maxQuantity with 0 <= minSelections <= maxSelections <= 99, and DECIMAL(12,2) in -9999999999.99..9999999999.99 for priceDelta), blocking validation errors for ACTIVE status under INV-MENU-005 and INV-MENU-010, and structured capacity deficit warnings for INACTIVE saves under REQ-MENU-LIF-002 and REQ-MENU-LIF-003."
      data:
        - structuralValidationStatus
        - incompleteCapacityWarnings
      controls:
        - saveDraftInactiveAction
        - saveAndActivateAction
        - cancelConfigurationAction
  displayedData:
    - id: leafItemContext
      name: Leaf Menu Item Context
      type: LeafMenuItemContextProjection
      description: "Commercial context and discriminator of the leaf MenuItem aggregate root owning the modifier groups. Modifiers are exclusive to leaf items (PREPARED and STOCKED) and absent from COMBO items."
      fields:
        - name: menuItemId
          type: UUID
          description: "Unique identifier of the leaf MenuItem aggregate root."
          trace: "REQ-MENU-MOD-001"
        - name: name
          type: String
          description: "Commercial name of the leaf MenuItem."
          trace: "REQ-MENU-MOD-001"
        - name: type
          type: String
          description: "Immutable item type discriminator ('PREPARED' or 'STOCKED'). Modifiers are completely absent from COMBO items in v1."
          trace: "REQ-MENU-MOD-001"
        - name: status
          type: String
          description: "Administrative status ('ACTIVE' or 'INACTIVE') of the leaf MenuItem."
          trace: "REQ-MENU-MOD-001, REQ-MENU-LIF-002"
        - name: currencyCode
          type: String
          description: "Read-only ISO 4217 3-character alphabetic currency code (e.g. 'MXN', 'USD') inherited from the owning menu catalog, establishing the fixed currency context for all variant unit prices and modifier price deltas."
          trace: "INV-MENU-007"
        - name: version
          type: String
          description: "Current immutable commercial revision token formatted as '<number>_<ISO8601>'."
          trace: "REQ-MENU-VER-001"
        - name: variants
          type: "List<LeafVariantSummaryProjection>"
          description: "List of active sellable variants belonging to this leaf item, available for specialization or copy operations."
          fields:
            - name: variantId
              type: UUID
              description: "Unique identifier of the MenuItemVariant."
              trace: "REQ-MENU-MOD-003"
            - name: name
              type: String
              description: "Commercial name or combined dimensional representation of the variant."
              trace: "REQ-MENU-MOD-003"
            - name: status
              type: String
              description: "Administrative status of the variant ('ACTIVE', 'INACTIVE', or 'ARCHIVED')."
              trace: "REQ-MENU-MOD-003, REQ-MENU-LIF-002"
            - name: unitPrice
              type: Decimal
              description: "Authoritative absolute selling unit price of the variant in exact DECIMAL(12,2) in range 0.00..9999999999.99 qualified by currencyCode."
              trace: "REQ-MENU-MOD-003, INV-MENU-008, INV-MENU-009"
            - name: currencyCode
              type: String
              description: "Read-only ISO 4217 3-character alphabetic currency code qualifying this variant's unitPrice."
              trace: "INV-MENU-007"
            - name: specializationsCount
              type: Integer
              description: "Count of explicit VariantModifierConfig overrides configured for this variant."
              trace: "REQ-MENU-MOD-003"
      trace: "REQ-MENU-MOD-001, REQ-MENU-MOD-003, REQ-MENU-VER-001, INV-MENU-007, INV-MENU-008, INV-MENU-009"
    - id: modifierGroups
      name: Modifier Groups and Options
      type: "List<ModifierGroupProjection>"
      description: "Collection of ModifierGroup entities owned directly by the leaf MenuItem and shared across all its variants, defining selection bounds and baseline options."
      fields:
        - name: modifierGroupId
          type: UUID
          description: "Unique identifier of the ModifierGroup."
          trace: "REQ-MENU-MOD-001"
        - name: menuItemId
          type: UUID
          description: "Identifier of the leaf MenuItem owning this group."
          trace: "REQ-MENU-MOD-001"
        - name: name
          type: String
          description: "Commercial display name of the modifier group (1..120 Unicode characters after trim, e.g. 'Aderezos', 'Tipo de Pan', 'Término de Cocción', 'Extras')."
          trace: "REQ-MENU-MOD-001, INV-MENU-012"
        - name: minSelections
          type: Integer
          description: "Minimum number of options that must be selected in this group, constrained to an integer in 0..99 (0 <= minSelections <= maxSelections <= 99)."
          trace: "REQ-MENU-MOD-001, INV-MENU-011"
        - name: maxSelections
          type: Integer
          description: "Maximum number of options that may be selected in this group, constrained to an integer in 0..99 (minSelections <= maxSelections <= 99)."
          trace: "REQ-MENU-MOD-001, INV-MENU-011"
        - name: optionsCount
          type: Integer
          description: "Total count of ModifierOptions defined in this group."
          trace: "REQ-MENU-MOD-001, REQ-MENU-MOD-002"
        - name: generalCalculatedCapacity
          type: Integer
          description: "Baseline structural capacity of the group: sum of maxQuantity across all options using generalConfig."
          trace: "REQ-MENU-MOD-001, INV-MENU-005"
        - name: isGeneralCapacitySatisfied
          type: Boolean
          description: "True if generalCalculatedCapacity >= minSelections."
          trace: "REQ-MENU-MOD-001, INV-MENU-005"
        - name: options
          type: "List<ModifierOptionProjection>"
          description: "List of ModifierOption entities defined within this group."
          fields:
            - name: modifierOptionId
              type: UUID
              description: "Unique identifier of the ModifierOption."
              trace: "REQ-MENU-MOD-002"
            - name: modifierGroupId
              type: UUID
              description: "Identifier of the parent ModifierGroup."
              trace: "REQ-MENU-MOD-002"
            - name: name
              type: String
              description: "Commercial name of the option (1..120 Unicode characters after trim, e.g. 'Extra queso', 'Sin cebolla', 'Término medio')."
              trace: "REQ-MENU-MOD-002, INV-MENU-012"
            - name: generalConfig
              type: ModifierOptionConfigProjection
              description: "Mandatory baseline general configuration governing any variant that does not register a specific override."
              fields:
                - name: priceDelta
                  type: Decimal
                  description: "Baseline commercial price delta added to variant unitPrice when selected, expressed in exact DECIMAL(12,2) in range -9999999999.99..9999999999.99 with at most 2 decimal places and no implicit rounding, qualified by menu ISO 4217 currencyCode."
                  trace: "REQ-MENU-MOD-002, INV-MENU-007, INV-MENU-008, INV-MENU-009"
                - name: maxQuantity
                  type: Integer
                  description: "Baseline maximum quantity of this option selectable in a single order line, constrained to an integer in range 0..99."
                  trace: "REQ-MENU-MOD-002, INV-MENU-011"
                - name: ingredientEffects
                  type: "List<IngredientEffectProjection>"
                  description: "List of ingredient directives (ADD, OMIT) applied to preparation inventory. An empty list denotes a culinary instruction without inventory consumption."
                  fields:
                    - name: effectId
                      type: UUID
                      description: "Local identifier for the effect entry."
                      trace: "REQ-MENU-MOD-005, REQ-MENU-MOD-006"
                    - name: operation
                      type: String
                      description: "Ingredient directive type: strictly 'ADD' or 'OMIT'. Other operations are not supported in v1."
                      trace: "REQ-MENU-MOD-005, REQ-MENU-MOD-006"
                    - name: inventoryItemId
                      type: String
                      description: "Opaque foreign identifier reference of the inventory ingredient affected."
                      trace: "REQ-MENU-MOD-005, REQ-MENU-MOD-006"
                    - name: quantity
                      type: "Decimal | null"
                      description: "Positive quantity to add (quantity > 0) for ADD operations; null for OMIT operations."
                      trace: "REQ-MENU-MOD-005, REQ-MENU-MOD-006"
                    - name: unit
                      type: "String | null"
                      description: "Formal metric inventory measurement unit (e.g. 'g', 'ml', 'piezas') for ADD operations; null for OMIT operations."
                      trace: "REQ-MENU-MOD-005, REQ-MENU-MOD-006"
                  trace: "REQ-MENU-MOD-002, REQ-MENU-MOD-005, REQ-MENU-MOD-006, REQ-MENU-MOD-007"
                - name: isCulinaryInstruction
                  type: Boolean
                  description: "Derived flag: true if ingredientEffects is empty, representing cooking, service, or culinary notes (e.g. 'Término medio', 'Salsa aparte') without stock impact."
                  trace: "REQ-MENU-MOD-007"
              trace: "REQ-MENU-MOD-002, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-011"
      trace: "REQ-MENU-MOD-001, REQ-MENU-MOD-002, REQ-MENU-MOD-005, REQ-MENU-MOD-006, REQ-MENU-MOD-007, INV-MENU-005, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-011, INV-MENU-012"
    - id: variantSpecializations
      name: Variant Specializations
      type: VariantSpecializationProjection
      description: "Configuration of variant-specific overrides (VariantModifierConfig) for the currently focused MenuItemVariant, illustrating inheritance and effective precedence."
      fields:
        - name: focusedVariantId
          type: "UUID | null"
          description: "Identifier of the MenuItemVariant currently selected for specialization inspection or editing."
          trace: "REQ-MENU-MOD-003"
        - name: focusedVariantName
          type: "String | null"
          description: "Display name of the focused MenuItemVariant."
          trace: "REQ-MENU-MOD-003"
        - name: groupSpecializations
          type: "List<VariantGroupSpecializationProjection>"
          description: "List of groups displaying options with effective configuration, override indicators, and variant-specific capacity evaluation."
          fields:
            - name: modifierGroupId
              type: UUID
              description: "Identifier of the ModifierGroup."
              trace: "REQ-MENU-MOD-001"
            - name: groupName
              type: String
              description: "Name of the modifier group (1..120 Unicode characters after trim)."
              trace: "REQ-MENU-MOD-001, INV-MENU-012"
            - name: minSelections
              type: Integer
              description: "Minimum selections required for this group, constrained to an integer in 0..99 (0 <= minSelections <= maxSelections <= 99)."
              trace: "REQ-MENU-MOD-001, INV-MENU-011"
            - name: maxSelections
              type: Integer
              description: "Maximum selections permitted for this group, constrained to an integer in 0..99 (minSelections <= maxSelections <= 99)."
              trace: "REQ-MENU-MOD-001, INV-MENU-011"
            - name: variantCalculatedCapacity
              type: Integer
              description: "Variant-specific structural capacity: sum of effectiveMaxQuantity across enabled options for this variant."
              trace: "REQ-MENU-MOD-001, REQ-MENU-MOD-003, INV-MENU-005"
            - name: isVariantCapacitySatisfied
              type: Boolean
              description: "True if variantCalculatedCapacity >= minSelections."
              trace: "REQ-MENU-MOD-001, REQ-MENU-MOD-003, INV-MENU-005"
            - name: optionOverrides
              type: "List<VariantOptionSpecializationItem>"
              description: "List of options showing effective commercial parameters and active VariantModifierConfig override details."
              fields:
                - name: modifierOptionId
                  type: UUID
                  description: "Identifier of the ModifierOption."
                  trace: "REQ-MENU-MOD-002, REQ-MENU-MOD-003"
                - name: optionName
                  type: String
                  description: "Commercial name of the option (1..120 Unicode characters after trim)."
                  trace: "REQ-MENU-MOD-002, INV-MENU-012"
                - name: hasOverride
                  type: Boolean
                  description: "True if a VariantModifierConfig entity is registered for this (variantId, modifierOptionId) tuple; false if inheriting generalConfig."
                  trace: "REQ-MENU-MOD-003"
                - name: effectiveEnabled
                  type: Boolean
                  description: "Effective enablement status: override.enabled if hasOverride else true (generalConfig baseline)."
                  trace: "REQ-MENU-MOD-003, REQ-MENU-MOD-008"
                - name: effectivePriceDelta
                  type: Decimal
                  description: "Effective price delta: override.priceDelta if hasOverride else generalConfig.priceDelta, expressed in exact DECIMAL(12,2) in range -9999999999.99..9999999999.99 qualified by menu ISO 4217 currencyCode."
                  trace: "REQ-MENU-MOD-003, REQ-MENU-MOD-008, INV-MENU-007, INV-MENU-008, INV-MENU-009"
                - name: effectiveMaxQuantity
                  type: Integer
                  description: "Effective configured maximum selectable quantity: override.maxQuantity if hasOverride else generalConfig.maxQuantity, constrained to an integer in range 0..99."
                  trace: "REQ-MENU-MOD-003, REQ-MENU-MOD-008, INV-MENU-011"
                - name: effectiveVariantPrice
                  type: Decimal
                  description: "Effective unit price of the focused variant with this option selected (unitPrice + effectivePriceDelta) in exact DECIMAL(12,2) qualified by menu ISO 4217 currencyCode; must be >= 0.00 under INV-MENU-010."
                  trace: "REQ-MENU-MOD-003, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-010"
                - name: isNegativePriceViolation
                  type: Boolean
                  description: "True if effectiveVariantPrice (unitPrice + effectivePriceDelta) < 0.00, surfacing a blocking price validation error under INV-MENU-010."
                  trace: "INV-MENU-010"
                - name: effectiveIngredientEffects
                  type: "List<IngredientEffectProjection>"
                  description: "Effective ingredient directives: override.ingredientEffects if hasOverride else generalConfig.ingredientEffects."
                  trace: "REQ-MENU-MOD-003, REQ-MENU-MOD-005, REQ-MENU-MOD-006, REQ-MENU-MOD-007, REQ-MENU-MOD-008"
                - name: overrideConfig
                  type: "VariantModifierConfigDetail | null"
                  description: "Explicit override details when hasOverride is true; null when inheriting generalConfig."
                  fields:
                    - name: id
                      type: UUID
                      description: "Unique identifier of the VariantModifierConfig entity."
                      trace: "REQ-MENU-MOD-003"
                    - name: enabled
                      type: Boolean
                      description: "Configured enablement flag for this specific variant."
                      trace: "REQ-MENU-MOD-003"
                    - name: priceDelta
                      type: Decimal
                      description: "Specialized price delta for this specific variant expressed in exact DECIMAL(12,2) in range -9999999999.99..9999999999.99 with at most 2 decimal places and no implicit rounding, qualified by menu ISO 4217 currencyCode."
                      trace: "REQ-MENU-MOD-003, INV-MENU-007, INV-MENU-008, INV-MENU-009"
                    - name: maxQuantity
                      type: Integer
                      description: "Specialized maximum quantity limit constrained to an integer in range 0..99 for this specific variant."
                      trace: "REQ-MENU-MOD-003, INV-MENU-011"
                    - name: ingredientEffects
                      type: "List<IngredientEffectProjection>"
                      description: "Specialized ingredient effects for this specific variant (e.g. 90g instead of 40g)."
                      trace: "REQ-MENU-MOD-003, REQ-MENU-MOD-005, REQ-MENU-MOD-006, REQ-MENU-MOD-007"
                  trace: "REQ-MENU-MOD-003"
      trace: "REQ-MENU-MOD-001, REQ-MENU-MOD-003, REQ-MENU-MOD-008, INV-MENU-005, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-010, INV-MENU-011, INV-MENU-012"
    - id: resolvedVariantModifiersProjection
      name: Resolved Variant Modifiers Projection
      type: "List<ResolvedVariantModifierProjection>"
      description: >
        Published commercial configuration read model (ResolvedVariantModifier) materialized for POS/KDS for each
        (variantId, modifierOptionId) pair. Reflects effective commercial configuration (enabled, priceDelta,
        configuredMaxQuantity, ingredientEffects) by applying VariantModifierConfig precedence over generalConfig.
        CRITICAL ARCHITECTURAL BOUNDARY: This projection provides commercial definitions only. Operational availability
        (isAvailable) and momentary dynamic limits (availableMaxQuantity) proceed exclusively from the decoupled
        ModifierAvailability read model and are NOT stored in or editable through this commercial view.
      fields:
        - name: variantId
          type: UUID
          description: "Identifier of the leaf MenuItemVariant."
          trace: "REQ-MENU-MOD-008"
        - name: modifierOptionId
          type: UUID
          description: "Identifier of the ModifierOption."
          trace: "REQ-MENU-MOD-008"
        - name: name
          type: String
          description: "Commercial display name of the option (1..120 Unicode characters after trim)."
          trace: "REQ-MENU-MOD-008, INV-MENU-012"
        - name: enabled
          type: Boolean
          description: "Effective administrative enablement status."
          trace: "REQ-MENU-MOD-008"
        - name: priceDelta
          type: Decimal
          description: "Resolved commercial price adjustment expressed in exact DECIMAL(12,2) in range -9999999999.99..9999999999.99 qualified by menu ISO 4217 currencyCode."
          trace: "REQ-MENU-MOD-008, INV-MENU-007, INV-MENU-008, INV-MENU-009"
        - name: maxQuantity
          type: Integer
          description: "Resolved configured commercial maximum quantity constrained to an integer in range 0..99."
          trace: "REQ-MENU-MOD-008, INV-MENU-011"
        - name: ingredientEffects
          type: "List<IngredientEffectProjection>"
          description: "Resolved list of ingredient directives (ADD, OMIT, or empty for culinary instruction)."
          trace: "REQ-MENU-MOD-008"
      trace: "REQ-MENU-MOD-008, INV-MENU-007, INV-MENU-008, INV-MENU-009, INV-MENU-011, INV-MENU-012"
    - id: administrativeCopyBuffer
      name: Administrative Copy Buffer and Report
      type: AdministrativeCopyBufferProjection
      description: "Operational buffer for copying VariantModifierConfig specializations from one source variant to one or more target variants of the same leaf MenuItem, supporting dry-run simulation, collision detection, and atomic execution."
      fields:
        - name: sourceVariantId
          type: "UUID | null"
          description: "Identifier of the source MenuItemVariant from which overrides are copied."
          trace: "REQ-MENU-MOD-004"
        - name: targetVariantIds
          type: "List<UUID>"
          description: "List of target MenuItemVariant identifiers of the same MenuItem to receive the copies."
          trace: "REQ-MENU-MOD-004"
        - name: policy
          type: String
          description: "Collision resolution policy: 'FAIL' (abort entire operation without changes on conflict) or 'REPLACE' (overwrite existing configurations on target variants)."
          trace: "REQ-MENU-MOD-004"
        - name: isDryRun
          type: Boolean
          description: "Flag indicating whether the last copy operation was executed as a dry-run simulation or a definitive execution."
          trace: "REQ-MENU-MOD-004"
        - name: lastReport
          type: "CopyReportProjection | null"
          description: "Detailed report emitted from the latest dry-run or definitive execution."
          fields:
            - name: sourceVariantId
              type: UUID
              description: "Source variant identifier."
              trace: "REQ-MENU-MOD-004"
            - name: targetVariantIds
              type: "List<UUID>"
              description: "Target variant identifiers."
              trace: "REQ-MENU-MOD-004"
            - name: configsToCopyCount
              type: Integer
              description: "Total number of VariantModifierConfig overrides identified on the source variant."
              trace: "REQ-MENU-MOD-004"
            - name: collisionsCount
              type: Integer
              description: "Number of collision conflicts detected on target variants."
              trace: "REQ-MENU-MOD-004"
            - name: collisions
              type: "List<CopyCollisionDetail>"
              description: "List of collision entries detailing conflicting target variant and modifier option configurations."
              fields:
                - name: targetVariantId
                  type: UUID
                  description: "Target variant with existing configuration."
                  trace: "REQ-MENU-MOD-004"
                - name: targetVariantName
                  type: String
                  description: "Name of the target variant."
                  trace: "REQ-MENU-MOD-004"
                - name: modifierOptionId
                  type: UUID
                  description: "Conflicting modifier option identifier."
                  trace: "REQ-MENU-MOD-004"
                - name: modifierOptionName
                  type: String
                  description: "Commercial name of the conflicting modifier option."
                  trace: "REQ-MENU-MOD-004"
                - name: existingConfigSummary
                  type: String
                  description: "Summary of existing override on target (e.g. 'enabled=true, priceDelta=+20, maxQty=1')."
                  trace: "REQ-MENU-MOD-004"
                - name: proposedConfigSummary
                  type: String
                  description: "Summary of proposed override from source (e.g. 'enabled=true, priceDelta=+45, maxQty=2')."
                  trace: "REQ-MENU-MOD-004"
              trace: "REQ-MENU-MOD-004"
            - name: outcome
              type: String
              description: "Simulation or execution outcome: 'SIMULATION_CLEAN', 'SIMULATION_COLLISIONS_BLOCKED', 'SIMULATION_REPLACE_ANTICIPATED', 'EXECUTED_SUCCESSFULLY', 'ABORTED_ON_CONFLICT_ROLLBACK'."
              trace: "REQ-MENU-MOD-004"
            - name: isAtomicRollback
              type: Boolean
              description: "True if the operation aborted with full atomic rollback and zero partial writes on conflict under FAIL policy."
              trace: "REQ-MENU-MOD-004"
          trace: "REQ-MENU-MOD-004"
      trace: "REQ-MENU-MOD-004"
    - id: structuralValidationStatus
      name: Structural and Pricing Validation Status
      type: StructuralValidationStatusProjection
      description: "Real-time evaluation of structural capacity constraints, quantitative bounds, and monetary invariants (non-negative effective variant prices in menu ISO 4217 currency) required for persistence and for transitioning or saving the leaf MenuItem in ACTIVE administrative status."
      fields:
        - name: isEligibleForActive
          type: Boolean
          description: "True if all modifier groups across the item and all active variants satisfy Capacidad(ModifierGroup) >= minSelections under INV-MENU-005 and zero blocking validation errors exist under INV-MENU-007..012."
          trace: "REQ-MENU-MOD-001, INV-MENU-005, INV-MENU-010"
        - name: hasNegativePriceViolation
          type: Boolean
          description: "True if any option priceDelta applied to a variant results in an effective variant price (unitPrice + effectivePriceDelta) < 0.00 under INV-MENU-010."
          trace: "INV-MENU-010"
        - name: blockingValidationErrors
          type: "List<String>"
          description: "List of blocking errors preventing transition to ACTIVE or persistence (e.g. 'El grupo obligatorio Aderezos carece de capacidad suficiente para minSelections=2', 'El precio resultante para la variante Simple con el modificador Descuento no puede ser negativo (-5.00 MXN)', 'El nombre del grupo debe tener entre 1 y 120 caracteres tras trim', 'minSelections y maxSelections deben ser enteros en 0..99 con 0 <= minSelections <= maxSelections <= 99', 'maxQuantity debe ser un entero en 0..99', 'priceDelta debe ser DECIMAL(12,2) en -9999999999.99..9999999999.99')."
          trace: "REQ-MENU-MOD-001, INV-MENU-005, INV-MENU-008, INV-MENU-009, INV-MENU-010, INV-MENU-011, INV-MENU-012"
      trace: "REQ-MENU-MOD-001, INV-MENU-005, INV-MENU-008, INV-MENU-009, INV-MENU-010, INV-MENU-011, INV-MENU-012"
    - id: incompleteCapacityWarnings
      name: Incomplete Capacity Warnings
      type: "List<IncompleteCapacityWarningItem>"
      description: "Structured warnings populated when saving the leaf MenuItem in INACTIVE administrative status with incomplete definitions or capacity deficits under REQ-MENU-LIF-002 and REQ-MENU-LIF-003."
      fields:
        - name: entityId
          type: UUID
          description: "Unique identifier of the affected ModifierGroup."
          trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
        - name: entityType
          type: String
          description: "Entity type identifier: strictly 'ModifierGroup'."
          trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
        - name: minSelections
          type: Integer
          description: "Configured minimum selection requirement that cannot currently be satisfied."
          trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
        - name: calculatedCapacity
          type: Integer
          description: "Calculated structural capacity: sum of maxQuantity across enabled options."
          trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
        - name: variantId
          type: "UUID | null"
          description: "Specific MenuItemVariant identifier if the deficit arises from variant-specific overrides; null if arising from generalConfig baseline."
          trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
        - name: warningMessage
          type: String
          description: "Human-readable diagnostic warning detailing the capacity deficit and INACTIVE containment."
          trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
      trace: "REQ-MENU-LIF-002, REQ-MENU-LIF-003"
  controls:
