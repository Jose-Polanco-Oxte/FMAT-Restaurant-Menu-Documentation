      trace: "REQ-MENU-MOD-004"
    - id: dryRunCopyAction
      type: action
      operatesOn: administrativeCopyBuffer
      triggersAction: dryRunCopyVariantModifierConfigs
      description: "Semantic action to simulate the copy operation without persisting modifications, evaluating collisions and generating a detailed dry-run report."
