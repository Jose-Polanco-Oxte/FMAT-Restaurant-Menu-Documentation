    - id: executeCopyAction
      type: action
      operatesOn: administrativeCopyBuffer
      triggersAction: executeCopyVariantModifierConfigs
      description: "Semantic action to execute definitive atomic copy of overrides from source to target variants, adhering strictly to FAIL or REPLACE collision resolution with zero partial writes on failure."
