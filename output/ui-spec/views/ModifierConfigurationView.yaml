      trace: "REQ-MENU-MOD-003, REQ-MENU-MOD-005"
    - id: updateVariantEffectUnitInput
      type: input
      operatesOn: variantSpecializations.optionOverrides.overrideConfig.ingredientEffects.unit
      triggersAction: setVariantIngredientEffectUnit
