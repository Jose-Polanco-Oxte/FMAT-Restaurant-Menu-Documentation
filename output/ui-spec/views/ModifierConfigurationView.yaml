    - id: copyTargetVariantsMultiSelector
      type: selection
      operatesOn: administrativeCopyBuffer.targetVariantIds
      triggersAction: setCopyTargetVariants
      description: "Semantic multi-selection control choosing one or more target MenuItemVariants of the same MenuItem to receive copied overrides."
      trace: "REQ-MENU-MOD-004"
    - id: copyPolicySelector
      type: selection
      operatesOn: administrativeCopyBuffer.policy
